# Dependency updates.
#
# Grouped rather than one PR per package: a self-hosted product's dependency
# churn is not interesting on its own, and twenty open PRs is how a security
# update gets lost among nineteen patch bumps.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything routine, in one PR.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Majors land by hand. Next, React and Drizzle each need the migration
      # notes read, and a bot PR that fails CI teaches nothing.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]
      - dependency-name: better-auth
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Both images run Node. Dependabot offers whatever major is newest, which is
  # how it proposed 25 while 22 and 24 are the LTS lines and 25 is not one.
  # Odd-numbered Node majors never become LTS, so they carry roughly six months
  # of support and no long-term security backports, which is the wrong trade
  # for software other people self-host.
  #
  # Node majors therefore move by hand, between LTS lines. 22 "Jod" is
  # supported to April 2027; revisit in early 2027, or sooner to pick up 24
  # "Krypton", checking sharp and Playwright first.
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
