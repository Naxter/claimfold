# Dependency updates.
#
# Grouped rather than one PR per package: a self-hosted product's dependency
# churn is not interesting on its own, and twenty open PRs is how a security
# update gets lost among nineteen patch bumps.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Everything routine, in one PR.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Majors land by hand. Next, React and Drizzle each need the migration
      # notes read, and a bot PR that fails CI teaches nothing.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: drizzle-orm
        update-types: [version-update:semver-major]
      - dependency-name: better-auth
        update-types: [version-update:semver-major]
      # zod 4 is a migration, not a bump. The pipeline authors every schema
      # once in zod and converts it to JSON Schema for structured output via
      # zod-to-json-schema, which is zod 3 only; zod 4 replaces it with a
      # built-in z.toJSONSchema(). Moving means rewriting that bridge and
      # re-checking the pass that strips keywords the provider APIs reject,
      # and getting that wrong is a 400 at generation time rather than a
      # failing test. better-auth also resolves its own zod, so the tree
      # already holds more than one copy. Do it deliberately or not at all.
      - dependency-name: zod
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native port, and typescript-eslint refuses to load
      # against it: "typescript-eslint does not support TS 7.0". The lint gate
      # is the whole reason that package is here, so the compiler cannot move
      # ahead of it. Everything else was fine on 7.0 when tried in August 2026:
      # tsc passed once a `declare module '*.css'` shim was added for the
      # stricter side-effect-import rule, and next build passed untouched.
      # Revisit when typescript-eslint ships >=7.1 support:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node tracks the runtime, not the newest release. Both images run
      # node:22 and engines says >=22, so types from a later major would let
      # tsc accept APIs that are not there at runtime. CI would stay green
      # until the first call to one of them. Bump this with the base image.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Both images run Node. Dependabot offers whatever major is newest, which is
  # how it proposed 25 while 22 and 24 are the LTS lines and 25 is not one.
  # Odd-numbered Node majors never become LTS, so they carry roughly six months
  # of support and no long-term security backports, which is the wrong trade
  # for software other people self-host.
  #
  # Node majors therefore move by hand, between LTS lines. 22 "Jod" is
  # supported to April 2027; revisit in early 2027, or sooner to pick up 24
  # "Krypton", checking sharp and Playwright first.
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
